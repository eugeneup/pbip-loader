name: Python package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must match the version in pyproject.toml.'
          }
      - name: Install and test
        run: |
          python -m pip install .
          if ($LASTEXITCODE -ne 0) { throw 'Package installation failed.' }
          python -m unittest discover -s tests -v
      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed.' }
          $wheel = Get-ChildItem -LiteralPath dist -Filter '*.whl' -File
          if (@($wheel).Count -ne 1) { throw 'Expected one wheel.' }
          $hash = (Get-FileHash -LiteralPath $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($wheel.Name)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.whl
            dist/SHA256SUMS.txt

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-wheel
          path: release
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $wheel = Get-ChildItem -LiteralPath release -Filter '*.whl' -File
          if (@($wheel).Count -ne 1) { throw 'Expected one wheel.' }
          $prerelease = @()
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { $prerelease = @('--prerelease') }
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --generate-notes --title "PBIP Loader $env:GITHUB_REF_NAME" @prerelease $wheel.FullName release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
